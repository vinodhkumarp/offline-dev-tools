<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield with glowing cyan outline -->
  <path d="M16 2L27 6.5V16C27 22.5 22.2 26.5 16 28C9.8 26.5 5 22.5 5 16V6.5L16 2Z" fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Tech Ring (Circular Circuit track) -->
  <circle cx="16" cy="15" r="7.5" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="4 2" opacity="0.8" />

  <!-- Circuit Nodes -->
  <circle cx="16" cy="7.5" r="1" fill="#38bdf8" filter="url(#logoGlow)" />
  <circle cx="8.5" cy="15" r="1" fill="#38bdf8" filter="url(#logoGlow)" />
  <circle cx="23.5" cy="15" r="1" fill="#38bdf8" filter="url(#logoGlow)" />
  <circle cx="16" cy="22.5" r="1" fill="#38bdf8" filter="url(#logoGlow)" />
  
  <!-- Connections -->
  <path d="M16 7.5V11M8.5 15H11.5M20.5 15H23.5M16 19V22.5" stroke="#38bdf8" stroke-width="0.5" opacity="0.6" />

  <!-- Central Keyhole containing the code brackets </> -->
  <path d="M14 12 C14 10.9 14.9 10 16 10 C17.1 10 18 10.9 18 12 C18 12.8 17.5 13.5 16.8 13.8 L 17.5 18 H 14.5 L 15.2 13.8 C 14.5 13.5 14 12.8 14 12 Z" fill="url(#shieldGrad)" />

  <!-- Small Code Brackets inside keyhole/center -->
  <path d="M13.5 15.5L12 15L13.5 14.5M18.5 14.5L20 15L18.5 15.5" stroke="#ffffff" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round" />
</svg>