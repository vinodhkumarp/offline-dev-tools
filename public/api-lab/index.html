<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src 'self' data: blob:; frame-src about: blob:; connect-src 'self' http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none';">
<title>ApiLab</title>
<style>
:root{--bg:#1b1d23;--panel:#23262e;--panel2:#2b2f38;--line:#3a3f4b;--text:#e6e8ee;--muted:#9aa1b0;--accent:#ff6c37;--blue:#4f8cff;--ok:#3fb950;--warn:#d29922;--err:#f85149;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 --c-key:#79b8ff;--c-str:#9ecb7b;--c-num:#f0a05a;--c-bool:#c792ea;--c-null:#8b93a3;--c-punc:#8b93a3;--c-kw:#c792ea;--c-cmt:#7d8590;--c-tag:#79b8ff;--c-attr:#f0a05a;
 --c-var:#ffab70;--c-varbg:rgba(255,108,55,.20);--c-miss:#ff7b72;--c-missbg:rgba(248,81,73,.22);--sel:rgba(79,140,255,.38)}
:root[data-theme=light]{--bg:#f5f6f8;--panel:#fff;--panel2:#eef0f4;--line:#d6dae1;--text:#1f2430;--muted:#6a7282;
 --c-key:#005cc5;--c-str:#22863a;--c-num:#b45309;--c-bool:#6f42c1;--c-null:#6a7282;--c-punc:#6a7282;--c-kw:#6f42c1;--c-cmt:#8a919e;--c-tag:#005cc5;--c-attr:#b45309;
 --c-var:#b3420f;--c-varbg:rgba(255,108,55,.18);--c-miss:#c4262e;--c-missbg:rgba(248,81,73,.16);--sel:rgba(79,140,255,.30)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:5px 9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
button{cursor:pointer}button:hover{border-color:var(--muted)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent}
button.x{background:transparent;border:none;color:var(--muted);padding:2px 6px}
button.x:hover{color:var(--err)}
button.ico{padding:5px 8px}
code{font-family:var(--mono);background:var(--panel2);padding:0 4px;border-radius:3px}
header{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:700;font-size:15px;color:var(--accent);margin-right:8px}
.sp{flex:1}
kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel2);color:var(--muted)}
#app{flex:1;display:flex;min-height:0}
aside{width:290px;min-width:180px;max-width:60vw;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#sbSplit{width:4px;cursor:col-resize;margin-left:-2px;z-index:2}
#sbSplit:hover{background:var(--accent)}
.stabs{display:flex;border-bottom:1px solid var(--line)}
.stabs button{flex:1;border:none;border-radius:0;background:transparent;padding:8px;color:var(--muted)}
.stabs button.on{color:var(--text);box-shadow:inset 0 -2px var(--accent)}
#sbar{padding:8px 8px 4px;display:flex;gap:6px;flex-wrap:wrap}
#sfilter{margin:4px 8px 6px;width:calc(100% - 16px)}
#sideList{flex:1;overflow:auto;padding:0 6px 10px}
.colh,.itm{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;cursor:pointer}
.colh:hover,.itm:hover{background:var(--panel2)}
.colh .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itm .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colh.root .nm{font-weight:600}
.acts{display:none;gap:0;flex:none}.colh:hover .acts,.itm:hover .acts{display:flex}
.itm.on{background:var(--panel2);box-shadow:inset 2px 0 var(--accent)}
.m{font:700 10px var(--mono);min-width:44px;text-align:left;flex:none}
.m.GET{color:#3fb950}.m.POST{color:#d29922}.m.PUT{color:#4f8cff}.m.PATCH{color:#a371f7}.m.DELETE{color:#f85149}.m.HEAD,.m.OPTIONS{color:#9aa1b0}
.muted{color:var(--muted)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:6px;padding:7px 10px;border-right:1px solid var(--line);cursor:pointer;white-space:nowrap;max-width:230px;color:var(--muted)}
.tab.on{background:var(--bg);color:var(--text);box-shadow:inset 0 2px var(--accent)}
.tab .nm{overflow:hidden;text-overflow:ellipsis}
.tab.dirty .nm::after{content:" •";color:var(--accent)}
#work{flex:1;display:flex;flex-direction:column;min-height:0}
#work.h{flex-direction:row}
#reqSec{display:flex;flex-direction:column;min-height:120px;height:48%;min-width:0}
#work.h #reqSec{height:auto;width:50%;min-width:320px}
#split{flex:none;height:5px;background:var(--line);cursor:row-resize}
#work.h #split{width:5px;height:auto;cursor:col-resize}
#split:hover{background:var(--accent)}
#respSec{flex:1;display:flex;flex-direction:column;min-height:120px;min-width:0}
.reqhead{display:flex;align-items:center;gap:6px;padding:8px 10px 0}
.reqhead #crumb{white-space:nowrap}
#rname{flex:1;min-width:80px;background:transparent;border-color:transparent;font-weight:600;font-size:14px;padding:3px 6px}
#rname:hover{border-color:var(--line)}
#rname:focus{background:var(--panel2)}
#dirtyDot{font-size:11px;color:var(--accent);white-space:nowrap}
.urlbar{display:flex;gap:6px;padding:8px 10px 10px;align-items:flex-start}
.urlbar #method{width:105px;font-weight:700;height:32px}
.urlbar .hli{flex:1}
.urlbar button{height:32px}
.sub{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.sub button{border:none;background:transparent;border-radius:0;color:var(--muted);padding:6px 10px;white-space:nowrap}
.sub button.on{color:var(--text);box-shadow:inset 0 -2px var(--accent)}
.sub .cnt{color:var(--ok);font-size:11px}
#reqPane,#respPane{flex:1;overflow:auto;padding:10px;min-height:0}
#reqPane.fill{display:flex;flex-direction:column;overflow:hidden}
#rstat{display:flex;gap:14px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);min-height:34px;flex:none;flex-wrap:wrap}
.pill{padding:2px 9px;border-radius:10px;font-weight:700;font-size:12px}
.pill.s2{background:#3fb95030;color:var(--ok)}.pill.s3{background:#4f8cff30;color:var(--blue)}.pill.s4{background:#d2992230;color:var(--warn)}.pill.s5,.pill.err{background:#f8514930;color:var(--err)}
.kv{display:flex;flex-direction:column;gap:4px}
.kvr{display:flex;gap:5px;align-items:center}
.kvr .kh{min-width:0}.kvr .kh.k{width:32%;flex:none}.kvr .kh.v{flex:1}
.kvr input.f{flex:1}.kvr input[type=checkbox]{width:auto}
.kvr select{width:70px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.row>label{min-width:80px;color:var(--muted)}
.tbar{display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.seg button{border-radius:0}.seg button:first-child{border-radius:5px 0 0 5px}.seg button:last-child{border-radius:0 5px 5px 0}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
/* ---- highlighted single-line input ---- */
.hli{position:relative;border:1px solid var(--line);border-radius:5px;background:var(--panel2);min-width:0}
.hli:focus-within{border-color:var(--blue)}
.hli .hbg,.hli input{font:inherit;line-height:20px;height:30px;padding:4px 9px;border:0;margin:0;white-space:pre;letter-spacing:normal;width:100%;border-radius:5px}
.hli .hbg{position:absolute;inset:0;overflow:hidden;pointer-events:none;color:var(--text)}
.hli input{position:relative;display:block;background:transparent;color:transparent;caret-color:var(--text)}
.hli input::selection{background:var(--sel);color:transparent}
.hli input::placeholder{color:var(--muted);opacity:.7}
.hli.mono .hbg,.hli.mono input{font-family:var(--mono);font-size:12.5px}
.hli.sm .hbg,.hli.sm input{height:28px;padding-top:3px}
.hli.plain .hbg{display:none}
.hli.plain input{color:var(--text)}
/* ---- code editor with highlighting ---- */
.ed{flex:1;display:flex;min-height:140px;border:1px solid var(--line);border-radius:5px 5px 0 0;background:var(--panel2);overflow:hidden}
.gut{margin:0;flex:none;min-width:40px;padding:8px 8px 20px 10px;text-align:right;color:var(--muted);opacity:.8;font:12.5px/20px var(--mono);overflow:hidden;user-select:none;border-right:1px solid var(--line)}
.edw{position:relative;flex:1;min-width:0}
.edw .bg,.edw textarea{position:absolute;inset:0;margin:0;padding:8px 10px 20px;font:12.5px/20px var(--mono);white-space:pre;tab-size:2;border:0;border-radius:0;letter-spacing:normal;word-spacing:normal;width:100%;height:100%}
.edw .bg{overflow:hidden;pointer-events:none;color:var(--text)}
.edw textarea{background:transparent;color:transparent;caret-color:var(--text);resize:none;overflow:auto}
.edw textarea::selection{background:var(--sel);color:transparent}
.edw textarea::placeholder{color:var(--muted);opacity:.7}
.edst{flex:none;display:flex;gap:12px;padding:3px 10px;border:1px solid var(--line);border-top:0;border-radius:0 0 5px 5px;font-size:11.5px;background:var(--panel);color:var(--muted)}
.edst .good{color:var(--ok)}.edst .bad{color:var(--err)}
.jk{color:var(--c-key)}.js{color:var(--c-str)}.jn{color:var(--c-num)}.jb{color:var(--c-bool)}.jz{color:var(--c-null)}.jp{color:var(--c-punc)}
.kw{color:var(--c-kw)}.cm{color:var(--c-cmt);font-style:italic}.tg{color:var(--c-tag)}.at{color:var(--c-attr)}
.vr{border-radius:3px}
.vr.ok{color:var(--c-var);background:var(--c-varbg)}
.vr.miss{color:var(--c-miss);background:var(--c-missbg)}
/* response code view */
.cb{display:flex;align-items:flex-start;font:12.5px/20px var(--mono)}
.cb .gut{padding:0 8px 0 4px;border:0;min-width:32px;position:sticky;left:0;background:var(--bg)}
.cb .code{margin:0;padding:0 8px;white-space:pre;flex:1;font:inherit}
.cb.wrap .code{white-space:pre-wrap;word-break:break-all}
pre.out{margin:0;font:12.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all}
table.t{border-collapse:collapse;width:100%}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top;word-break:break-all}
table.t th{color:var(--muted);font-weight:600}
.empty{color:var(--muted);text-align:center;margin-top:40px}
.errbox{color:var(--err);white-space:pre-wrap;font-family:var(--mono)}
.pass{color:var(--ok)}.fail{color:var(--err)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.chip{font-size:11.5px;padding:2px 8px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--text);border-color:var(--muted)}
/* overlays */
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:50}
.ov.top{align-items:flex-start;padding-top:12vh}
.md{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:520px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}
.md.wide{width:900px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.mb{padding:14px;overflow:auto}
.mb textarea{width:100%;font-family:var(--mono);font-size:12px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:6px;display:none;z-index:90}
.envl{display:flex;gap:14px;min-height:300px}.envl .lft{width:200px}.envl .rgt{flex:1}
.envl .itm{margin-left:0}
iframe.prev{width:100%;height:100%;min-height:300px;border:1px solid var(--line);background:#fff;border-radius:5px}
img.prev{max-width:100%}
/* palette */
.pal{width:560px;max-width:95vw;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 20px 50px #0008}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 14px;font-size:15px;background:transparent}
.pal .list{max-height:50vh;overflow:auto;padding:4px}
.pal .it{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:6px;cursor:pointer}
.pal .it.on{background:var(--panel2);box-shadow:inset 2px 0 var(--accent)}
.pal .it .hint{margin-left:auto;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.pal .grp{padding:6px 10px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
/* popovers */
#vtip,.acbox,.pop{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px #0006;font-size:12px}
#vtip{padding:6px 9px;max-width:380px;pointer-events:none;display:none;word-break:break-all}
.acbox{min-width:220px;max-width:420px;max-height:220px;overflow:auto;padding:3px}
.acbox .ai{display:flex;gap:10px;padding:3px 8px;border-radius:4px;cursor:pointer;align-items:center}
.acbox .ai.on{background:var(--blue);color:#fff}
.acbox .ai .av{margin-left:auto;opacity:.7;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11px}
.pop{padding:8px;width:380px;max-height:60vh;overflow:auto}
.tagp{font-size:10px;padding:0 6px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="logo">⚡ ApiLab</div>
  <span class="sp"></span>
  <span class="muted" title="Local ApiLab Java proxy that sends the requests">Proxy</span><input id="proxyUrl" style="width:170px" spellcheck="false">
  <span class="muted">Environment</span>
  <select id="envSel"></select>
  <button id="envEye" class="ico" title="Quick look at current variables">👁</button>
  <button id="envBtn">Manage</button>
  <button id="palBtn" title="Command palette">Search <kbd>Ctrl K</kbd></button>
  <button id="layBtn" class="ico" title="Switch layout (stacked / side by side)">⇆</button>
  <button id="themeBtn" class="ico" title="Theme">🌓</button>
  <button id="impBtn">Import</button>
  <button id="expBtn">Export all</button>
  <button id="helpBtn">Help</button>
</header>
<div id="app">
  <aside id="side">
    <div class="stabs"><button data-s="collections" class="on">Collections</button><button data-s="history">History</button></div>
    <div id="sbar"></div>
    <input id="sfilter" placeholder="Filter requests…" spellcheck="false">
    <div id="sideList"></div>
  </aside>
  <div id="sbSplit"></div>
  <main>
    <div id="tabs"></div>
    <div id="work">
      <section id="reqSec">
        <div class="reqhead">
          <span id="crumb" class="muted"></span>
          <input id="rname" placeholder="Untitled Request" spellcheck="false" title="Request name">
          <span id="dirtyDot"></span>
          <button id="saveBtn">Save</button>
          <button id="codeBtn">&lt;/&gt; Code</button>
        </div>
        <div class="urlbar">
          <select id="method"></select>
          <div id="urlHost"></div>
          <button id="send" class="pri">Send</button>
        </div>
        <div class="sub" id="subs"></div>
        <div id="reqPane"></div>
      </section>
      <div id="split"></div>
      <section id="respSec">
        <div id="rstat"></div>
        <div class="sub" id="rsubs"></div>
        <div id="respPane"></div>
      </section>
    </div>
  </main>
</div>
<div id="toast"></div>
<div id="vtip"></div>
<datalist id="hn"><option>Accept<option>Accept-Language<option>Authorization<option>Cache-Control<option>Content-Type<option>Cookie<option>If-None-Match<option>Origin<option>Referer<option>User-Agent<option>X-Api-Key<option>X-Correlation-Id<option>X-Requested-With</datalist>

<script>
'use strict';
const KEY='apilab.v1';
/* Where the local ApiLab Java proxy lives. Same origin when served by the proxy itself; localhost:5050 when embedded in offline-dev-tools. */
const PROXY_KEY='apilab.proxy';
const embedded=window.parent!==window;
const getProxy=()=>{try{const v=localStorage.getItem(PROXY_KEY);if(v)return v.replace(/\/+$/,'')}catch(e){}return embedded?'http://localhost:5050':''};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const METHODS=['GET','POST','PUT','PATCH','DELETE','HEAD','OPTIONS'];
const STATUS={200:'OK',201:'Created',202:'Accepted',204:'No Content',301:'Moved Permanently',302:'Found',304:'Not Modified',307:'Temporary Redirect',308:'Permanent Redirect',400:'Bad Request',401:'Unauthorized',403:'Forbidden',404:'Not Found',405:'Method Not Allowed',409:'Conflict',415:'Unsupported Media Type',422:'Unprocessable Entity',429:'Too Many Requests',500:'Internal Server Error',502:'Bad Gateway',503:'Service Unavailable',504:'Gateway Timeout'};
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const unb64=s=>decodeURIComponent(escape(atob(s)));
const newRow=()=>({id:uid(),k:'',v:'',on:true,t:'text'});
const newReq=(o={})=>({id:uid(),name:'',method:'GET',url:'',desc:'',params:[newRow()],headers:[newRow()],
  auth:{type:'none',token:'',user:'',pass:'',key:'',value:'',in:'header'},
  body:{type:'none',raw:'',form:[newRow()],urlenc:[newRow()]},pre:'',tests:'',
  settings:{follow:true,insecure:false,timeout:30000},collectionId:null,...o});
const newNode=(name)=>({id:uid(),name,open:true,requests:[],folders:[]});
const clone=o=>JSON.parse(JSON.stringify(o));
const isUntitled=r=>!r.name||r.name==='New Request'||r.name==='Untitled Request';
const reqTitle=r=>!isUntitled(r)?r.name:(r.url?r.url.replace(/^https?:\/\//,'').slice(0,42):'Untitled Request');

let S={collections:[],history:[],envs:[],activeEnv:'',globals:[newRow()],tabs:[],active:null,sideTab:'collections',layout:'v',theme:'auto',sbw:290};
const RESP={}, FILES={};
let sub='params', rsub='body', rview='pretty', ctrl=null, filterQ='';
const bulk={params:false,headers:false};

function normalize(n){n.requests=n.requests||[];n.folders=n.folders||[];if(n.open===undefined)n.open=true;n.requests.forEach(r=>{if(r.desc===undefined)r.desc=''});n.folders.forEach(normalize)}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d)S={...S,...d}}catch(e){}S.collections.forEach(normalize);S.tabs.forEach(r=>{if(r.desc===undefined)r.desc=''})}
let scopeCache=null;
function save(){scopeCache=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let saveT;
function touch(){const r=cur();if(r)r.dirty=true;clearTimeout(saveT);saveT=setTimeout(save,300);renderTabs();renderHead()}
const cur=()=>S.tabs.find(t=>t.id===S.active);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}
function copy(txt){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}).finally?.(()=>toast('Copied'))}
function download(name,data,type='application/octet-stream'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

function modal(title,html,{wide=false,okText='OK',onOk,hideOk=false,onClose}={}){
  const d=document.createElement('div');d.className='ov';
  d.innerHTML=`<div class="md ${wide?'wide':''}"><div class="mh"><b>${title}</b><button class="x">✕</button></div><div class="mb">${html}</div>${hideOk?'':`<div class="mf"><button class="ghost" data-c>Cancel</button><button class="pri" data-ok>${okText}</button></div>`}</div>`;
  document.body.appendChild(d);
  const close=()=>{d.remove();onClose&&onClose()};d._close=close;
  $('.mh .x',d).onclick=close;d.onmousedown=e=>{if(e.target===d)close()};
  if(!hideOk){$('[data-c]',d).onclick=close;$('[data-ok]',d).onclick=async()=>{if(onOk&&(await onOk(d))===false)return;close()}}
  return {el:d,close};
}
function askText(title,def='',okText='OK'){return new Promise(res=>{let done=false;

  fn(['above','gt','greaterThan'],x=>chk(v>x,`expected ${fmt(v)} to be above ${x}`));
  fn(['below','lt','lessThan'],x=>chk(v<x,`expected ${fmt(v)} to be below ${x}`));
  fn(['least','gte'],x=>chk(v>=x,`expected ${fmt(v)} to be at least ${x}`));
  fn(['most','lte'],x=>chk(v<=x,`expected ${fmt(v)} to be at most ${x}`));
  fn(['include','includes','contain','contains'],x=>chk(typeof v==='string'||Array.isArray(v)?v.includes(x):(v&&typeof v==='object'&&Object.entries(x).every(([k,y])=>eq(v[k],y))),`expected ${fmt(v)} to include ${fmt(x)}`));
  fn(['a','an'],t=>chk((t==='array'?Array.isArray(v):t==='null'?v===null:typeof v===t),`expected ${fmt(v)} to be a ${t}`));

  fn(['match'],re=>chk(re.test(v),`expected ${fmt(v)} to match ${re}`));

    if(q){if(c===q)q=null;else if(q==='"'&&c==='\\'&&i+1<s.length&&'"\\$`'.includes(s[i+1]))cur+=s[++i];else cur+=c}
    else if(c==="'"||c==='"'){q=c;has=true}
    else if(/\s/.test(c)){if(cur||has){out.push(cur);cur='';has=false}}
    else if(c==='\\'&&i+1<s.length)cur+=s[++i];else cur+=c}

function importText(t){
  t=t.trim();if(!t)throw new Error('Nothing to import');
  if(/^curl\b/i.test(t)){const r=fromCurl(t);openReq(r);return 'Imported cURL request into a new tab'}
  let j;try{j=JSON.parse(t)}catch(e){throw new Error('Not valid JSON or a cURL command')}
  if(j.info&&j.item){const c=newNode(j.info.name||'Imported');c.open=true;pmNode(j.item,c);S.collections.push(c);
    let extra='';if(Array.isArray(j.variable)&&j.variable.length){S.envs.push({id:uid(),name:(c.name)+' (collection variables)',vars:[...j.variable.filter(v=>v.key).map(v=>({...newRow(),k:v.key,v:String(v.value??'')})),newRow()]});renderEnvSel();extra=' and its variables as an environment'}
    renderSide();save();return `Imported collection "${c.name}" (${collectReqs(c).length} requests)${extra}`}
  if(j.apilab){(j.collections||[]).forEach(c=>{if(allNodes().some(x=>x.node.id===c.id))c.id=uid();normalize(c);S.collections.push(c)});
    (j.envs||[]).forEach(e=>{if(S.envs.some(x=>x.id===e.id))e.id=uid();S.envs.push(e)});renderSide();renderEnvSel();save();return 'Imported ApiLab backup'}
  if(Array.isArray(j.values)){S.envs.push({id:uid(),name:j.name||'Imported env',vars:[...j.values.map(v=>({...newRow(),k:v.key,v:v.value,on:v.enabled!==false})),newRow()]});renderEnvSel();save();return `Imported environment "${j.name||'Imported env'}"`}
  throw new Error('Unrecognised format (supported: cURL, Postman collection v2.x, Postman environment, ApiLab backup)');
}

function jpath(obj,path){
  path=path.trim();if(!path||path==='$')return obj;
  const toks=[];path.replace(/^\$/,'').replace(/\[(\d+|\*)\]|\['([^']+)'\]|\["([^"]+)"\]|\.([^.\[\]]+)/g,(m,i,a,b,c)=>{toks.push(i??a??b??c);return m});
  if(!toks.length)throw new Error('Use a path like $.data[0].id');
  let curv=[obj],wild=false;
  for(const t of toks){const nx=[];for(const c of curv){
      if(t==='*'){wild=true;if(Array.isArray(c))nx.push(...c);else if(c&&typeof c==='object')nx.push(...Object.values(c))}
      else if(c!=null&&typeof c==='object'&&t in c)nx.push(c[t])}
    curv=nx;if(!curv.length)throw new Error('No match for '+path)}
  return wild?curv:curv[0]}
function renderResp(){
  const r=cur(),res=RESP[r.id],st=$('#rstat'),rs=$('#rsubs'),p=$('#respPane');
  if(!res){st.innerHTML='';rs.innerHTML='';p.innerHTML='<div class="empty">Hit <b>Send</b> (<kbd>Ctrl</kbd> <kbd>Enter</kbd>) to get a response</div>';return}
  if(res.loading){st.innerHTML='<span class="muted">Sending…</span>';rs.innerHTML='';p.innerHTML='';return}
  if(res.error&&!res.status){st.innerHTML='<span class="pill err">Error</span>';rs.innerHTML=`<button class="${rsub==='console'?'on':''}" data-r="console">Console</button><button class="${rsub!=='console'?'on':''}" data-r="body">Details</button>`;
    p.innerHTML=rsub==='console'?consoleHtml(res):`<pre class="errbox">${esc(res.error)}</pre><div class="muted" style="margin-top:12px">Is the URL reachable from this machine? For internal hosts with self-signed certificates tick “Ignore SSL certificate errors” under Settings.</div>`;return}
  const pass=res.tests.filter(t=>t.pass).length;
  const cookies=res.headers.filter(h=>h[0].toLowerCase()==='set-cookie');
  st.innerHTML=`<span class="pill s${String(res.status)[0]}">${res.status} ${esc(res.statusText)}</span><span>Time: <b>${Math.round(res.time)} ms</b></span><span>Size: <b>${fmtSize(res.size)}</b></span><span class="muted">${res.proto||''}</span>${res.tests.length?`<span class="${pass===res.tests.length?'pass':'fail'}">Tests ${pass}/${res.tests.length}</span>`:''}<span class="sp"></span>`;
  rs.innerHTML=[['body','Body'],['headers',`Headers (${res.headers.length})`],['cookies',`Cookies (${cookies.length})`],['tests',`Tests${res.tests.length?` (<span class="${pass===res.tests.length?'pass':'fail'}">${pass}/${res.tests.length}</span>)`:''}`],['console',`Console${res.logs.length?` (${res.logs.length})`:''}`]].map(([k,l])=>`<button data-r="${k}" class="${k===rsub?'on':''}">${l}</button>`).join('');
  if(rsub==='headers'){
    p.innerHTML=`<div class="tbar"><input id="hf" placeholder="Filter headers…" style="width:240px"></div><div id="ht"></div>`;
    const draw=q=>{$('#ht',p).innerHTML=`<table class="t"><tr><th style="width:30%">Name</th><th>Value</th></tr>${res.headers.filter(h=>!q||(h[0]+h[1]).toLowerCase().includes(q)).map(h=>`<tr><td><b>${esc(h[0])}</b></td><td>${esc(h[1])}</td></tr>`).join('')}</table>`};
    draw('');$('#hf',p).oninput=e=>draw(e.target.value.toLowerCase())}
  else if(rsub==='cookies')p.innerHTML=cookies.length?`<table class="t"><tr><th>Name</th><th>Value</th><th>Attributes</th></tr>${cookies.map(c=>{const parts=c[1].split(';');const [n,...v]=parts[0].split('=');return `<tr><td><b>${esc(n)}</b></td><td>${esc(v.join('='))}</td><td>${esc(parts.slice(1).join(';').trim())}</td></tr>`}).join('')}</table>`:'<div class="empty">No cookies in this response</div>';
  else if(rsub==='tests')p.innerHTML=res.tests.length?res.tests.map(t=>`<div class="${t.pass?'pass':'fail'}">${t.pass?'✔ PASS':'✘ FAIL'} &nbsp;${esc(t.name)}${t.msg?` <span class="muted">— ${esc(t.msg)}</span>`:''}</div>`).join(''):'<div class="empty">No tests. Add some under the Tests tab of the request.</div>';
  else if(rsub==='console')p.innerHTML=consoleHtml(res);
  else bodyView(res,p);
}
function consoleHtml(res){return res.logs.length?`<pre class="out">${res.logs.map(l=>`<span class="${l.t==='err'?'fail':l.t==='warn'?'':'muted'}">${esc(l.m)}</span>`).join('\n')}</pre>`:'<div class="empty">Nothing logged. Use console.log() in scripts.</div>'}
function bodyView(res,p){
  const ct=res.ct.toLowerCase();let isJson=/json/.test(ct),parsed;let pretty=res.text;
  if(!isJson&&/^\s*[\[{]/.test(res.text)){try{JSON.parse(res.text);isJson=true}catch(e){}}
  if(isJson){try{parsed=JSON.parse(res.text);pretty=JSON.stringify(parsed,null,2)}catch(e){isJson=false}}
  const isImg=/^image\//.test(ct),isHtml=/html/.test(ct),isXml=/xml/.test(ct);
  if(!res.size){p.innerHTML='<div class="empty">This response has no body</div>';return}
  const big=res.text.length>300000;
  p.innerHTML=`<div class="tbar">${isImg?'':`<span class="seg"><button data-v="pretty" class="${rview==='pretty'?'on':''}">Pretty</button><button data-v="raw" class="${rview==='raw'?'on':''}">Raw</button>${isHtml?`<button data-v="preview" class="${rview==='preview'?'on':''}">Preview</button>`:''}</span>`}${isJson&&rview==='pretty'?'<input id="jf" placeholder="Filter: $.data[0].name  or  $.items[*].id" style="width:300px;font-family:var(--mono)" spellcheck="false">':''}<span class="sp"></span><button id="wrapb">Wrap</button><button id="cpb">Copy</button><button id="svb">Save to file</button></div><div id="bv"></div><div id="jerr" class="fail" style="margin-top:6px"></div>`;
  const bv=$('#bv');let shown=pretty,wrap=false;
  const mode=isJson?'json':(isXml||isHtml)?'xml':'text';
  const draw=()=>{
    if(isImg){const u=URL.createObjectURL(new Blob([res.buf],{type:ct}));bv.innerHTML=`<img class="prev" src="${u}">`;return}
    if(!res.text&&res.size){bv.innerHTML=`<div class="muted">Binary response (${fmtSize(res.size)}, ${esc(res.ct||'unknown type')}). Use “Save to file”.</div>`;return}
    if(rview==='preview'&&isHtml){bv.innerHTML='<iframe class="prev" sandbox></iframe>';$('iframe',bv).srcdoc=res.text;return}
    const txt=rview==='pretty'?shown:res.text;
    if(big){bv.innerHTML=`<div class="muted">Large response – highlighting is off.</div><pre class="out">${esc(txt.slice(0,2e6))}</pre>`;return}
    bv.innerHTML=codeBlock(txt,rview==='pretty'?mode:'text');$('.cb',bv).classList.toggle('wrap',wrap)};
  draw();
  const jf=$('#jf',p);
  if(jf)jf.oninput=()=>{const e=$('#jerr',p);e.textContent='';try{const v=jpath(parsed,jf.value);shown=JSON.stringify(v,null,2)??'undefined'}catch(err){shown=pretty;e.textContent=jf.value.trim()?err.message:''}draw()};
  $('#wrapb',p).onclick=()=>{wrap=!wrap;const c=$('.cb',bv);if(c)c.classList.toggle('wrap',wrap)};
  $('#cpb').onclick=()=>copy(rview==='pretty'?shown:res.text);
  $('#svb').onclick=()=>download('response'+(isJson?'.json':isHtml?'.html':isXml?'.xml':/image\/(\w+)/.test(ct)?'.'+RegExp.$1:'.txt'),res.buf,ct||undefined);
  $$('[data-v]',p).forEach(b=>b.onclick=()=>{rview=b.dataset.v;renderResp()});
}
$('#rsubs').onclick=e=>{const b=e.target.closest('button');if(b){rsub=b.dataset.r;renderResp()}};

/* ================= collection runner ================= */
function runner(n){
  const reqs=collectReqs(n);
  const m=modal(`Run: ${esc(n.name)}`,`<div class="tbar"><button class="pri" id="go">▶ Run ${reqs.length} requests</button><span id="sum" class="muted"></span></div><table class="t" id="rt"><tr><th>Request</th><th>Status</th><th>Time</th><th>Tests</th></tr></table>`,{wide:true,hideOk:true});
  $('#go',m.el).onclick=async()=>{
    const tb=$('#rt',m.el);tb.innerHTML='<tr><th>Request</th><th>Status</th><th>Time</th><th>Tests</th></tr>';let tp=0,tt=0,ok=0;
    for(const r of reqs){const tr=document.createElement('tr');tr.innerHTML=`<td><span class="m ${r.method}">${r.method}</span> ${esc(reqTitle(r))}</td><td colspan="3" class="muted">running…</td>`;tb.appendChild(tr);
      const res=await execute(clone(r));const p=res.tests.filter(t=>t.pass).length;tp+=p;tt+=res.tests.length;if(res.status)ok++;
      tr.innerHTML=`<td><span class="m ${r.method}">${r.method}</span> ${esc(reqTitle(r))}</td><td>${res.status?`<span class="pill s${String(res.status)[0]}">${res.status}</span>`:`<span class="fail">${esc((res.error||'').split('\n')[0])}</span>`}</td><td>${res.time?Math.round(res.time)+' ms':''}</td><td>${res.tests.length?`<span class="${p===res.tests.length?'pass':'fail'}">${p}/${res.tests.length}</span>`:'—'}${res.tests.filter(t=>!t.pass).map(t=>`<div class="fail" style="font-size:11px">✘ ${esc(t.name)}${t.msg?': '+esc(t.msg):''}</div>`).join('')}</td>`;
      $('#sum',m.el).textContent=`${ok}/${reqs.length} responded · tests ${tp}/${tt} passed`}
    save();
  };
}

/* ================= command palette ================= */
function openPalette(){
  if($('.pal'))return;
  const ov=document.createElement('div');ov.className='ov top';
  ov.innerHTML='<div class="pal"><input placeholder="Search requests, environments and actions…" spellcheck="false"><div class="list"></div></div>';
  document.body.appendChild(ov);ov._close=()=>ov.remove();ov.onmousedown=e=>{if(e.target===ov)ov.remove()};
  const inp=$('input',ov),list=$('.list',ov);inp.focus();
  const acts=[['New request',()=>openReq(newReq()),''],['Send request',sendCurrent,'Ctrl+Enter'],['Save request',()=>saveReq(),'Ctrl+S'],['Save request as…',()=>saveReq(true),'Ctrl+Shift+S'],
    ['Show code snippet',showCode,''],['Import…',()=>$('#impBtn').click(),''],['Manage environments',()=>$('#envBtn').click(),''],['Export everything',()=>$('#expBtn').click(),''],
    ['Switch layout (stacked / side by side)',()=>$('#layBtn').click(),''],['Toggle theme',()=>$('#themeBtn').click(),''],['Show help & shortcuts',()=>$('#helpBtn').click(),''],
    ['Close current tab',()=>closeTab(S.active),''],['Close all other tabs',()=>{S.tabs=S.tabs.filter(t=>t.id===S.active);renderAll();save()},'']];
  let items=[],idx=0;
  const build=q=>{const words=q.toLowerCase().split(/\s+/).filter(Boolean);const ok=s=>words.every(w=>s.toLowerCase().includes(w));
    const rq=[];S.collections.forEach(c=>walkReqs(c,(r,n)=>{const s=`${r.method} ${reqTitle(r)} ${r.url}`;if(ok(s)&&!S.tabs.some(t=>t.id===r.id))rq.push({g:'Requests',label:`<span class="m ${r.method}">${r.method}</span> ${esc(reqTitle(r))}`,hint:(pathOf(n.id)||[]).join(' / '),run:()=>openReq(clone(r))})}));
    const op=S.tabs.filter(t=>ok(`${t.method} ${reqTitle(t)} ${t.url}`)).map(t=>({g:'Open tabs',label:`<span class="m ${t.method}">${t.method}</span> ${esc(reqTitle(t))}`,hint:t.url,run:()=>{S.active=t.id;renderAll()}}));
    const ev=S.envs.filter(e=>ok('environment '+e.name)).map(e=>({g:'Environments',label:'Use environment: '+esc(e.name),hint:e.id===S.activeEnv?'active':'',run:()=>{S.activeEnv=e.id;save();renderEnvSel();renderReq();toast('Environment: '+e.name)}}));
    const ac_=acts.filter(a=>ok(a[0])).map(a=>({g:'Actions',label:esc(a[0]),hint:a[2],run:a[1]}));
    items=[...op,...rq.slice(0,30),...ev,...ac_];idx=0;draw()};
  const draw=()=>{let last='';list.innerHTML=items.length?items.map((it,i)=>{const g=it.g!==last?`<div class="grp">${it.g}</div>`:'';last=it.g;return g+`<div class="it ${i===idx?'on':''}" data-i="${i}"><span>${it.label}</span><span class="hint">${esc(it.hint||'')}</span></div>`}).join(''):'<div class="empty" style="margin:20px">Nothing found</div>';list.querySelector('.on')?.scrollIntoView({block:'nearest'})};
  const run=i=>{const it=items[i];ov.remove();if(it)setTimeout(it.run,0)};
  inp.oninput=()=>build(inp.value);
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();idx=Math.min(items.length-1,idx+1);draw()}else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(0,idx-1);draw()}else if(e.key==='Enter'){e.preventDefault();run(idx)}};
  list.onclick=e=>{const i=e.target.closest('[data-i]');if(i)run(+i.dataset.i)};
  build('');
}

/* ================= layout / keyboard ================= */
function renderAll(){renderSide();renderTabs();renderReq();renderResp()}
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key==='Enter'){e.preventDefault();sendCurrent()}
  else if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();saveReq(e.shiftKey)}
  else if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}
  else if(mod&&e.key.toLowerCase()==='l'){e.preventDefault();urlH&&urlH.input.focus()}
  else if(e.key==='Escape'&&!ac){const o=$$('.ov').pop();if(o){e.preventDefault();o._close?o._close():o.remove()}else $$('.pop').forEach(x=>x.remove())}
});

  addEventListener('mouseup',()=>{drag=false;document.body.style.userSelect=''});

    else rq.style.height=Math.max(140,Math.min(b.height-160,e.clientY-b.top))+'px'})})();

load();
if(!S.tabs.length){const r=newReq();S.tabs.push(r);S.active=r.id}
if(!S.tabs.find(t=>t.id===S.active))S.active=S.tabs[0].id;

applyTheme();applyLayout();renderEnvSel();renderAll();
